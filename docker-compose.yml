services:
  # Local Temporal dev server (file-backed SQLite, no TLS/auth) for the v2 health check
  # and future workflows. gRPC on 7233, web UI on http://localhost:8233.
  # Matches the local TEMPORAL_* env in .mise/config.toml (auth disabled).
  temporal:
    image: temporalio/temporal:1.7.3@sha256:906f9765cde508333ef191aab908bc724657b5f736cb5ead13921d9a45b33622
    command:
      - "server"
      - "start-dev"
      - "--ip"
      - "0.0.0.0"
      - "--log-level"
      - "warn"
      - "--db-filename"
      - "/data/temporal.db"
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data

volumes:
  temporal-data:
