services:
  # Local Temporal dev server (file-backed SQLite, no TLS/auth) for the v2 health check
  # and future workflows. Non-default host ports to avoid colliding with other
  # projects: gRPC on 17233, web UI on http://localhost:18233.
  # The CLI defaults to localhost:17233 (override with TEMPORAL_ADDRESS).
  temporal:
    image: temporalio/temporal:1.7.3@sha256:906f9765cde508333ef191aab908bc724657b5f736cb5ead13921d9a45b33622
    # The image runs as the non-root "temporal" user (uid 1000), but a fresh
    # named volume is created owned by root, so uid 1000 can't create the
    # SQLite DB in /data (SQLITE_CANTOPEN, shown as "out of memory (14)").
    # Running as root lets the dev server write to the persistent volume.
    user: root
    command:
      - "server"
      - "start-dev"
      - "--ip"
      - "0.0.0.0"
      - "--log-level"
      - "warn"
      - "--db-filename"
      - "/data/temporal.db"
    ports:
      - "17233:7233"
      - "18233:8233"
    volumes:
      - temporal-storage:/data

  # Durable execution history, fleet plans, and Agent Hub dismissals (see
  # internal/execstore and internal/agenthub/hubpg).
  # It is deliberately separate from Temporal's own datastore: Temporal ages out
  # completed executions, so the recorded history must outlive it (and survive a
  # Temporal-scoped state wipe). Non-default host port 15432 avoids colliding
  # with a Postgres already running on 5432.
  postgres:
    image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
    environment:
      # Fixed local dev credentials: this is a single-operator local stack, so the
      # DSN is predictable and the database is created for you on first start.
      # Because the credentials are deliberately guessable, the loopback-only port
      # binding below is what keeps the store private.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temporal_agents
    ports:
      # Loopback only. The store holds prompts, agent output, PR links and verbatim
      # failure text, and the credentials are fixed, so it must not be reachable
      # from the rest of the network. The worker and CLI run on the host, so nothing
      # else needs the port.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d temporal_agents"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The local identity provider, so signing in works with no external account and no
  # provider registration: bring the stack up, click once, signed in. Its
  # configuration (including the one local operator's credentials) is in
  # deploy/dex/config.yaml.
  #
  # The host port is fixed rather than assigned, because an OpenID provider's issuer
  # identifier is part of what every client verifies: the provider has to be reachable
  # at exactly the URL it was configured with.
  dex:
    image: ghcr.io/dexidp/dex:v2.44.0@sha256:5d0656fce7d453c0e3b2706abf40c0d0ce5b371fb0b73b3cf714d05f35fa5f86
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./deploy/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      # Loopback only. The provider issues the hub's sessions, and its local client
      # secret is fixed and public, so nothing outside this machine may reach it.
      - "127.0.0.1:15556:5556"

volumes:
  temporal-storage:
  postgres-storage:
