services:
  postgres:
    image: postgres:16.13-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: temporal_agents
    ports: [5432:5432]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Local Temporal dev server (file-backed SQLite, no TLS/auth) for the v2 health check
  # and future workflows. gRPC on 7233, web UI on http://localhost:8233.
  # Matches the local TEMPORAL_* env in .mise/config.toml (auth disabled).
  temporal:
    image: temporalio/temporal:1.7.3@sha256:906f9765cde508333ef191aab908bc724657b5f736cb5ead13921d9a45b33622
    command:
      - "server"
      - "start-dev"
      - "--ip"
      - "0.0.0.0"
      - "--log-level"
      - "warn"
      - "--db-filename"
      - "/data/temporal.db"
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal-data:/data

volumes:
  postgres-data:
  temporal-data:
