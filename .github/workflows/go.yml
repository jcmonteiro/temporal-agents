# Build, vet, and test the Go project.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # The execstore adapter suite skips itself without TEST_DATABASE_URL, so without
    # a database CI would report green while never exercising the SQL, the upsert
    # conflict rule, or the migrations. A throwaway service container closes that
    # gap; its name ends in "_test", which the suite insists on before truncating.
    services:
      postgres:
        # Pinned by digest, like the compose service, so CI tests the same Postgres
        # the local stack runs.
        image: postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: temporal_agents_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - "5432:5432"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Single source of truth: keeps CI in sync with the module version.
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/temporal_agents_test?sslmode=disable
        run: go test -race -shuffle=on ./...
