# Build, vet, and test the Go project.
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # The execstore adapter suite starts its own Postgres with testcontainers-go
    # against the runner's Docker daemon, so there is no service container to
    # declare and nothing to configure: `go test ./...` runs the SQL, the upsert
    # conflict rule and the migrations for real.

    steps:
      - uses: actions/checkout@v4

      # The Go HTTP API browser test builds and loads the web application.
      # Set up its package manager and browser before the all-suite test target.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Single source of truth: keeps CI in sync with the module version.
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          PLAYWRIGHT_INSTALL_ARGS: --with-deps chromium
        run: make test
